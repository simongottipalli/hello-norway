version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
      - "${API_PORT:-3001}:${API_PORT:-3001}"
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set — see .env.example}
      SESSION_COOKIE_SECRET: ${SESSION_COOKIE_SECRET:?SESSION_COOKIE_SECRET must be set — see .env.example}
      PORT: ${PORT:-3000}
      API_PORT: ${API_PORT:-3001}
      # If you change API_PORT, set API_BASE_URL explicitly (e.g. http://localhost:4001/api)
      API_BASE_URL: http://localhost:${API_PORT:-3001}/api
      # If you change PORT, set NEXT_PUBLIC_SITE_URL explicitly (e.g. http://localhost:4000)
      NEXT_PUBLIC_SITE_URL: http://localhost:${PORT:-3000}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-brevo}
      EMAIL_FROM: ${EMAIL_FROM}
      BREVO_API_KEY: ${BREVO_API_KEY}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      # These must match the credentials in DATABASE_URL above.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: hello_norway
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\""]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
